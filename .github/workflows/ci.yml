name: CI

# Two independent jobs, one per language, so a frontend failure does not
# hide a backend one and both start at the same time.
#
# ## Why `push` is limited to main
#
# Pushing a commit to a branch that has an open pull request fires BOTH
# `push` and `pull_request`, and the workflow then runs twice on the same
# commit — the same tests, twice the minutes, two sets of checks to read.
#
# So each event covers what only it can see:
#   pull_request  every proposed change, on every branch
#   push: main    what actually landed, including a direct push and the
#                 merge commit a pull request produces
#
# The consequence to know about: a branch with no pull request open gets
# no CI. That is the intent — open the pull request and it runs. Use the
# manual trigger below when you want a run without one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight. Without
# this, a burst of commits queues up runs whose results nobody will read.
#
# `head_ref` is the branch name on a pull request and empty elsewhere, so
# this groups a pull request by its branch rather than by the synthetic
# `refs/pull/N/merge`.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Never cancel on main: those runs are the record of what shipped, and
  # two commits landing close together would leave the first unverified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5

      # One source of truth for the Node version: webapp/.nvmrc, which
      # Vercel and `nvm use` read too. Hardcoding a number here is what
      # let CI (22) and the dev machine (24) drift apart.
      - uses: actions/setup-node@v5
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails
      # if package.json and the lockfile disagree, which is the failure
      # worth catching here.
      - run: npm ci

      # npm 10 validates package-lock.json more strictly than npm 11,
      # which ships with Node 24 and installs a lockfile with missing
      # entries without complaining — it does not fetch what is absent,
      # it silently leaves it out, so the tree ends up short a package.
      # That is how a lockfile missing @swc/helpers@0.5.23 reached main
      # while every local `npm ci` reported success.
      #
      # Now that every environment is on Node 24, nothing would catch
      # that class of corruption any more, so this step keeps the check
      # explicitly rather than relying on a version mismatch to provide
      # it by accident. It installs nothing and costs a few seconds.
      # Same check before pushing:  cd webapp && npx npm@10 ci --dry-run
      - name: Lockfile integrity
        run: npx -y npm@10 ci --dry-run

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Placeholders. Nothing dials them: every route is dynamic (the
      # root layout resolves the locale from cookies), so no page is
      # prerendered against api.invalid. Real values live in the
      # deployment environment; a build that needed a real one would be
      # a bug worth failing on.
      #
      # This step is NOT offline, despite what these placeholders
      # suggest: app/layout.tsx imports three families from
      # next/font/google, fetched from Google at build time. A network
      # failure there fails the build with no fallback.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://api.invalid
          NEXT_PUBLIC_SUPABASE_URL: http://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      # requirements_dev pulls in requirements.txt, so this is the full
      # runtime plus the test tooling.
      - run: pip install -r requirements_dev.txt

      # Rule selection and the reasons for it live in pyproject.toml.
      - name: Lint
        run: ruff check .

      # No database and no API keys: everything under tests/ is pure
      # logic by design. A test that needed either would fail here,
      # which is the signal we want rather than a hidden dependency.
      - name: Tests
        run: pytest tests -q
